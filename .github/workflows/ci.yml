name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.23.x', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: test -z "$(gofmt -l *.go)"
      - run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - if: matrix.go == 'stable'
        run: go test -run '^$' -fuzz '^FuzzReader$' -fuzztime 10s -parallel 2
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 scripts/check_experiments.py
